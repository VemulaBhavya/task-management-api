<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e9">
  <title>Task Desk</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202b25;
      --muted: #70796f;
      --paper: #f4f1e9;
      --panel: #fffdf8;
      --line: #d9ded4;
      --green: #246b4b;
      --green-dark: #194b35;
      --coral: #c6563e;
      --yellow: #e7b844;
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Aptos", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font: 15px/1.5 var(--sans);
      background-color: var(--paper);
      background-image: radial-gradient(#c8cfc0 0.65px, transparent 0.65px);
      background-size: 17px 17px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 17px clamp(20px, 5vw, 72px);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 248, .88);
    }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; color: white; background: var(--green); border-radius: 9px 9px 9px 2px; }
    .brand-mark svg { width: 19px; }
    .connection { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .connection::before { content: ""; width: 8px; height: 8px; background: var(--yellow); border-radius: 50%; }
    .connection.online::before { background: #4b9a68; }
    main { max-width: 1240px; margin: 0 auto; padding: clamp(27px, 5vw, 58px) clamp(18px, 4vw, 48px) 64px; }
    .heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 27px; animation: arrive .45s ease-out both; }
    h1 { margin: 0; font: 500 clamp(34px, 5vw, 52px)/1.05 var(--serif); letter-spacing: 0; }
    .heading p { margin: 9px 0 0; color: var(--muted); }
    .total { color: var(--green); font: 500 32px/1 var(--serif); white-space: nowrap; }
    .workspace { display: grid; grid-template-columns: minmax(250px, 340px) minmax(0, 1fr); gap: clamp(22px, 4vw, 48px); align-items: start; }
    .editor { padding: 21px; border: 1px solid var(--line); border-top: 3px solid var(--green); background: var(--panel); box-shadow: 0 12px 30px rgba(32, 43, 37, .04); }
    h2 { margin: 0 0 18px; font-size: 16px; }
    label { display: block; margin: 13px 0 6px; color: #4c584e; font-size: 12px; font-weight: 700; }
    input, select, textarea { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink); background: white; font: inherit; }
    textarea { min-height: 82px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 2px solid rgba(36, 107, 75, .22); border-color: var(--green); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { min-height: 40px; padding: 8px 13px; border: 1px solid transparent; border-radius: 3px; cursor: pointer; font: 700 13px var(--sans); }
    button:focus-visible { outline: 3px solid rgba(36, 107, 75, .3); outline-offset: 2px; }
    .primary { width: 100%; margin-top: 17px; color: white; background: var(--green); }
    .primary:hover { background: var(--green-dark); }
    .cancel { display: none; width: 100%; margin-top: 8px; color: var(--muted); background: transparent; border-color: var(--line); }
    .cancel.visible { display: block; }
    .list-area { min-width: 0; }
    .filters { display: grid; grid-template-columns: repeat(4, minmax(100px, 1fr)) auto; gap: 9px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .filters select, .filters input { padding: 8px; font-size: 13px; }
    .clear { min-height: 36px; color: var(--green); background: transparent; border-color: var(--line); }
    .task-list { display: grid; gap: 0; }
    .task { display: grid; grid-template-columns: 5px minmax(0, 1fr) auto; gap: 15px; align-items: stretch; padding: 17px 2px 17px 0; border-bottom: 1px solid var(--line); animation: arrive .32s ease-out both; }
    .task-accent { border-radius: 3px; background: #a5b4a5; }
    .task-accent.done { background: var(--green); }
    .task-accent.urgent { background: var(--coral); }
    .task-title { margin: 0; overflow-wrap: anywhere; font-size: 16px; font-weight: 700; }
    .task-description { margin: 4px 0 0; color: var(--muted); overflow-wrap: anywhere; font-size: 13px; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; color: var(--muted); font-size: 11px; }
    .tag { padding: 2px 7px; border-radius: 2px; background: #e8eee6; color: #3d5b47; }
    .tag.high { background: #f7e4dd; color: #97452f; }
    .task-actions { display: flex; align-items: center; gap: 5px; }
    .icon-button { width: 34px; min-width: 34px; min-height: 34px; padding: 8px; color: var(--muted); background: transparent; border-color: transparent; }
    .icon-button:hover { color: var(--green-dark); background: #eef1e9; }
    .icon-button.delete:hover { color: var(--coral); background: #fbefeb; }
    .icon-button svg { width: 16px; height: 16px; display: block; }
    .empty, .notice { padding: 30px 8px; color: var(--muted); text-align: center; }
    .notice { padding: 10px 12px; margin-bottom: 14px; border-left: 3px solid var(--coral); background: #fbefeb; text-align: left; }
    .pagination { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 16px; color: var(--muted); font-size: 13px; }
    .page-actions { display: flex; gap: 7px; }
    .page-actions button { min-height: 34px; color: var(--green); background: var(--panel); border-color: var(--line); }
    .page-actions button:disabled { cursor: default; opacity: .45; }
    @keyframes arrive { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 760px) {
      .workspace { grid-template-columns: 1fr; }
      .editor { order: 1; }
      .list-area { order: 0; }
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .heading { align-items: start; }
      .total { font-size: 26px; }
    }
    @media (max-width: 430px) {
      header { padding-inline: 16px; }
      main { padding-inline: 15px; }
      .task { gap: 10px; }
      .task-actions { flex-direction: column; }
      .connection { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 12 4 4L19 6"/></svg></span><span>Task Desk</span></div>
    <div id="connection" class="connection" role="status">Connecting</div>
  </header>
  <main>
    <section class="heading"><div><h1>Tasks, in order.</h1><p>A clear view of what needs doing.</p></div><div class="total" id="total">0 tasks</div></section>
    <div class="workspace">
      <form class="editor" id="task-form">
        <h2 id="form-heading">Add a task</h2>
        <label for="title">Title</label><input id="title" name="title" maxlength="255" required autocomplete="off" placeholder="What needs doing?">
        <label for="description">Description</label><textarea id="description" name="description" placeholder="Add a few details"></textarea>
        <div class="form-row">
          <div><label for="status">Status</label><select id="status" name="status"><option>TODO</option><option>IN_PROGRESS</option><option>DONE</option></select></div>
          <div><label for="priority">Priority</label><select id="priority" name="priority"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select></div>
        </div>
        <label for="due_date">Due date</label><input id="due_date" name="due_date" type="date">
        <button class="primary" id="save-button" type="submit">Add task</button>
        <button class="cancel" id="cancel-button" type="button">Cancel edit</button>
      </form>
      <section class="list-area" aria-label="Task list">
        <div id="notice" class="notice" role="alert" hidden></div>
        <div class="filters" aria-label="Task filters">
          <select id="filter-status" aria-label="Filter by status"><option value="">All statuses</option><option>TODO</option><option>IN_PROGRESS</option><option>DONE</option></select>
          <select id="filter-priority" aria-label="Filter by priority"><option value="">All priorities</option><option>LOW</option><option>MEDIUM</option><option>HIGH</option></select>
          <input id="filter-from" type="date" aria-label="Due date from">
          <input id="filter-to" type="date" aria-label="Due date to">
          <button class="clear" id="clear-filters" type="button">Clear</button>
        </div>
        <div id="task-list" class="task-list" aria-live="polite"></div>
        <div class="pagination"><span id="page-label">Page 1</span><div class="page-actions"><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button></div></div>
      </section>
    </div>
  </main>
  <script>
    const pageSize = 8;
    let page = 1;
    let total = 0;
    let editingId = null;
    const form = document.querySelector("#task-form");
    const list = document.querySelector("#task-list");
    const notice = document.querySelector("#notice");
    const connection = document.querySelector("#connection");
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);

    function showError(message) {
      notice.textContent = message;
      notice.hidden = false;
    }

    async function api(url, options = {}) {
      const response = await fetch(url, { ...options, headers: { "Content-Type": "application/json", ...options.headers } });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.message || `Request failed (${response.status})`);
      }
      return response.status === 204 ? null : response.json();
    }

    function taskElement(task) {
      const row = document.createElement("article");
      row.className = "task";
      const dueLabel = task.due_date ? `Due ${task.due_date}` : "No due date";
      row.innerHTML = `
        <span class="task-accent ${task.status === "DONE" ? "done" : task.priority === "HIGH" ? "urgent" : ""}" aria-hidden="true"></span>
        <div><h3 class="task-title">${escapeHtml(task.title)}</h3>
          ${task.description ? `<p class="task-description">${escapeHtml(task.description)}</p>` : ""}
          <div class="meta"><span class="tag">${escapeHtml(task.status.replace("_", " "))}</span><span class="tag ${task.priority === "HIGH" ? "high" : ""}">${escapeHtml(task.priority)} priority</span><span>${escapeHtml(dueLabel)}</span></div>
        </div>
        <div class="task-actions">
          <button class="icon-button edit" type="button" aria-label="Edit ${escapeHtml(task.title)}" title="Edit task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m14 5 5 5M4 20l4-.8L19 8a2.1 2.1 0 0 0-3-3L5 16l-1 4Z"/></svg></button>
          <button class="icon-button delete" type="button" aria-label="Delete ${escapeHtml(task.title)}" title="Delete task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        </div>`;
      row.querySelector(".edit").addEventListener("click", () => beginEdit(task));
      row.querySelector(".delete").addEventListener("click", () => removeTask(task));
      return row;
    }

    async function loadTasks() {
      notice.hidden = true;
      const params = new URLSearchParams({ page, size: pageSize });
      [["status", "#filter-status"], ["priority", "#filter-priority"], ["due_date_from", "#filter-from"], ["due_date_to", "#filter-to"]]
        .forEach(([key, selector]) => { const value = document.querySelector(selector).value; if (value) params.set(key, value); });
      try {
        const result = await api(`/tasks?${params}`);
        total = result.total;
        list.replaceChildren(...result.items.map(taskElement));
        if (!result.items.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = total ? "No tasks on this page." : "No tasks match. Add one to get started.";
          list.append(empty);
        }
        document.querySelector("#total").textContent = `${total} ${total === 1 ? "task" : "tasks"}`;
        document.querySelector("#page-label").textContent = `Page ${page} of ${Math.max(1, Math.ceil(total / pageSize))}`;
        document.querySelector("#previous").disabled = page <= 1;
        document.querySelector("#next").disabled = page * pageSize >= total;
        connection.textContent = "API connected";
        connection.classList.add("online");
      } catch (error) {
        connection.textContent = "API unavailable";
        connection.classList.remove("online");
        showError(error.message);
      }
    }

    function beginEdit(task) {
      editingId = task.id;
      form.elements.title.value = task.title;
      form.elements.description.value = task.description || "";
      form.elements.status.value = task.status;
      form.elements.priority.value = task.priority;
      form.elements.due_date.value = task.due_date || "";
      document.querySelector("#form-heading").textContent = "Edit task";
      document.querySelector("#save-button").textContent = "Save changes";
      document.querySelector("#cancel-button").classList.add("visible");
      form.elements.title.focus();
    }

    function resetForm() {
      editingId = null;
      form.reset();
      document.querySelector("#form-heading").textContent = "Add a task";
      document.querySelector("#save-button").textContent = "Add task";
      document.querySelector("#cancel-button").classList.remove("visible");
    }

    async function removeTask(task) {
      if (!window.confirm(`Delete “${task.title}”?`)) return;
      try {
        await api(`/tasks/${task.id}`, { method: "DELETE" });
        if (list.children.length === 1 && page > 1) page--;
        await loadTasks();
      } catch (error) { showError(error.message); }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      notice.hidden = true;
      const payload = Object.fromEntries(new FormData(form));
      payload.due_date = payload.due_date || null;
      try {
        await api(editingId ? `/tasks/${editingId}` : "/tasks", {
          method: editingId ? "PUT" : "POST",
          body: JSON.stringify(payload)
        });
        resetForm();
        page = 1;
        await loadTasks();
      } catch (error) { showError(error.message); }
    });
    document.querySelector("#cancel-button").addEventListener("click", resetForm);
    ["#filter-status", "#filter-priority", "#filter-from", "#filter-to"].forEach((selector) =>
      document.querySelector(selector).addEventListener("change", () => { page = 1; loadTasks(); }));
    document.querySelector("#clear-filters").addEventListener("click", () => {
      ["#filter-status", "#filter-priority", "#filter-from", "#filter-to"].forEach((selector) => document.querySelector(selector).value = "");
      page = 1;
      loadTasks();
    });
    document.querySelector("#previous").addEventListener("click", () => { if (page > 1) { page--; loadTasks(); } });
    document.querySelector("#next").addEventListener("click", () => { if (page * pageSize < total) { page++; loadTasks(); } });
    loadTasks();
  </script>
</body>
</html>
